[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-context-assistant"
version = "0.1.0"
description = "Provenance-aware message ingestion and contact-specific retrieval for a personal assistant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
personal-context = "personal_context.cli:main"
personal-context-eval = "personal_context.evaluation:main"
personal-context-memory = "personal_context.memory_cli:main"
personal-context-draft = "personal_context.draft_cli:main"
personal-context-review = "personal_context.review_server:main"

[tool.setuptools.packages.find]
where = ["src"]
